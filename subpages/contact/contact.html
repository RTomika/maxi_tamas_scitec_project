<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="contact.css">
    <title>Kapcsolat</title>
</head>
<body>
    <a href="../../index.html" class="goBack">Vissza</a>

    <div class="container">
        <div class="row middleCont">
            <div class="col-md-6">
                <h2>Kérdésed van?</h2>
                <div class="lines"></div>
                <p>Ne félj, kérdezz bátran! Ha esetleg akad olyan információ ami nincs tisztán leírva itt a weboldalunkon, vagy akár a facebook oldalunk, küldj egy üzenetet, és megpróbálunk minnél hamarabb visszajelezni!</p>
                <div class="iconCont">
                    <i class="fa-brands fa-instagram"></i>
                    <i class="fa-brands fa-facebook-f"></i>
                    <i class="fa-brands fa-tiktok"></i>
                </div>
            </div>

            <div class="col-md-6">
                <form action="#">
                    <input type="text" placeholder="Név:">
                    <input type="text" placeholder="Email:">
                    <textarea placeholder="Mit szeretnél üzenni?"></textarea>
                    <button type="submit" class="submit">Küldés</button>
                </form>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/6f2de72ade.js" crossorigin="anonymous"></script>
